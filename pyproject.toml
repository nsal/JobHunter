[project]
name = "jobhunter"
version = "0.1.0"
description = "A local tool for tracking job applications."
requires-python = ">=3.14,<3.15"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30,<1",
    "jinja2>=3.1,<4",
    "python-multipart>=0.0.9,<1",
    "openai>=2,<3",
    "pydantic>=2,<3",
    "pyyaml>=6,<7",
    "markdown-it-py>=4,<5",
    "python-docx>=1.1,<2",
]

[dependency-groups]
dev = [
    "pytest>=8,<9",
    "mypy>=1.11,<2",
    "ruff>=0.6,<1",
    "httpx2>=2,<3",
    "asgi-lifespan>=2,<3",
    "types-pyyaml>=6,<7",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 80

[tool.mypy]
python_version = "3.14"
check_untyped_defs = true
disallow_untyped_defs = true
