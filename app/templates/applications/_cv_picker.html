<section class="cv-picker" aria-label="Choose CV file">
  <header class="dialog-heading">
    <h2>Choose CV</h2>
    <button type="button" data-close-dialog="cv-picker-dialog">Close</button>
  </header>
  <p class="path-summary">{{ directory or '.' }}</p>
  <nav class="picker-nav" aria-label="CV folders">
    {% if parent is not none %}
    <button type="button" hx-get="/cv-picker?directory={{ parent|urlencode }}"
            hx-target="#cv-picker-content">Up</button>
    {% endif %}
    {% for item in directories %}
    <button type="button" hx-get="/cv-picker?directory={{ item.path|urlencode }}"
            hx-target="#cv-picker-content">📁 {{ item.name }}</button>
    {% endfor %}
  </nav>
  {% if files %}
  <ul class="picker-files">
    {% for item in files %}
    <li><button type="button" data-cv-uri="{{ item.uri }}"
                data-cv-name="{{ item.name }}">{{ item.name }}</button></li>
    {% endfor %}
  </ul>
  {% else %}
  <p>No PDF, DOC, or DOCX files in this folder.</p>
  {% endif %}
</section>
